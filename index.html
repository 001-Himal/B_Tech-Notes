<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTech Notes</title>
  <meta name="description" content="Personal university notes library for B.Tech studies — organized by subject and unit, easy to read and print.">
  <meta name="theme-color" content="#4361ee">
  <meta property="og:title" content="BTech Notes">
  <meta property="og:description" content="Personal university notes library for B.Tech studies.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Reading Progress Bar -->
  <div class="reading-progress-bar" id="reading-progress-bar"></div>

  <!-- Loading bar -->
  <div class="loading-bar" id="loading-bar"></div>

  <!-- Header -->
  <header class="header" id="header">
    <div class="header-left">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a href="#/" class="logo" id="logo">
        <span>BTech Notes</span>
        <span class="logo-badge">Docs</span>
      </a>
    </div>
    <div class="header-right">
      <button class="search-trigger" id="search-trigger" aria-label="Search notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Search notes…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Layout -->
  <div class="layout">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar" aria-label="Subject navigation">
      <div class="sidebar-section-label">Subjects</div>
      <ul class="sidebar-nav" id="sidebar-nav">
        <!-- Generated by script.js -->
      </ul>
    </nav>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main">
      <div class="content" id="content">
        <!-- Views rendered by script.js -->
      </div>
    </main>

    <!-- Outline (On This Page) -->
    <aside class="outline" id="outline" aria-label="On this page">
      <div class="outline-label">On this page</div>
      <ul class="outline-list" id="outline-list">
        <!-- Generated by script.js for unit pages -->
      </ul>
    </aside>
  </div>

  <!-- Search Modal -->
  <div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search notes">
    <div class="search-modal-content">
      <div class="search-input-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search across all notes…" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <div class="search-results" id="search-results">
        <div class="search-empty">Start typing to search across all notes</div>
      </div>
    </div>
  </div>

  <!-- Image Modal / Lightbox -->
  <div class="image-modal" id="image-modal" role="dialog" aria-modal="true" aria-label="Expanded Image Preview">
    <div class="image-modal-backdrop" id="image-modal-backdrop"></div>
    <div class="image-modal-container">
      <button class="image-modal-close" id="image-modal-close" aria-label="Close image preview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <img src="" alt="" class="image-modal-img" id="image-modal-img">
      <div class="image-modal-caption" id="image-modal-caption"></div>
    </div>
  </div>

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
